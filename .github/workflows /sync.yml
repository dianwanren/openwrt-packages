  name: Sync selected packages

  on:
    schedule:
      - cron: '0 0 * * 0'
    workflow_dispatch:

  permissions:
    contents: write

  env:
    PACKAGES: "luci-theme-argon luci-app-argon-config"

  jobs:
    sync:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: 只拉取指定文件夹
          run: |
            git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-packages upstream
            cd upstream
            git sparse-checkout set $PACKAGES

        - name: 复制到本仓库
          run: |
            for p in $PACKAGES; do
              if [ -d "upstream/$p" ]; then
                rm -rf "$p"
                cp -r "upstream/$p" "$p"
                echo "已同步: $p"
              else
                echo "::warning::上游仓库中没有找到文件夹: $p"
              fi
            done
            rm -rf upstream

        - name: 提交并推送
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || (git commit -m "sync: $(date '+%Y-%m-%d %H:%M')" && git push)
